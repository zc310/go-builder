name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$(sed -n 's/^ARG GO_LEGACY_VERSION=//p' Dockerfile)"
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$version" && ! "$tag" =~ ^${version//./\\.}-r[0-9]+$ ]]; then
              echo "发布标签应为 v$version 或 v$version-rN，与 Dockerfile 工具链版本保持一致。" >&2
              exit 1
            fi
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只发布本次运行的临时标签。两个架构均通过测试后再合并正式标签。
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.image.outputs.tag }}
          pull: true
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

      - name: Smoke test as non-root
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm --user 10001:10001 --env HOME=/tmp \
            "$IMAGE" go-builder-smoke

  publish:
    name: Publish multi-architecture tags
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested manifests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$image:${GITHUB_REF_NAME#v}" --tag "$image:latest")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$image:main")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
